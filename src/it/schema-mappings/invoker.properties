# Resolve the plugin's dependencies before the offline invocations.
invoker.goals.1 = process-sources
invoker.buildResult.1 = success
invoker.goals.2 = process-sources
invoker.offline.2 = true
invoker.buildResult.2 = success
invoker.goals.3 = process-sources -Dschema.location=http://127.0.0.1:1/unmapped.json
invoker.offline.3 = true
invoker.buildResult.3 = failure
invoker.goals.4 = process-sources -Dschema.location=http://127.0.0.1:1/unmapped.json -Dallow.remote.schemas=false
invoker.buildResult.4 = failure
